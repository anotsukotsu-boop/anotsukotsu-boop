name: Loop Stats

on:
  schedule:
    - cron: "23 17 * * *" # daily, 00:23 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build_stats.py"
      - "tools/svgkit.py"
      - ".github/workflows/loop-stats.yml"

permissions:
  contents: write

concurrency:
  group: loop-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: tools/.fonts
          key: svg-fonts-v1

      - run: pip install fonttools

      - name: Build the stats cards (dark + light)
        run: python tools/build_stats.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-light.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh loop stats"
          git push
